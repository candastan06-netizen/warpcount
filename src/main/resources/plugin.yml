name: WarpCount
version: 1.0.0
main: com.yourserver.warpcount.WarpCountPlugin
api-version: "1.13"

depend:
  - Essentials

commands:
  warpcount:
    description: Opens a GUI showing player counts near every Essentials warp.
    usage: /warpcount
    permission: warpcount.use

permissions:
  warpcount.use:
    description: Allows the player to use the warp count GUI.
    default: true
